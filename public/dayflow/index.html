rics{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-bottom:15px}.metric,.panel,.col{background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow)}.metric{padding:15px}.metric span{font-size:10px;color:var(--muted)}.metric strong{display:block;font-size:24px;margin-top:5px}.board{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.col{padding:14px;min-height:330px}.colhead{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:10px}.colhead h3{font-size:14px;margin:0 0 2px}.colhead p{font-size:9px;color:#8e98aa;margin:0}.count{font-size:9px;background:#f1f3f7;color:#657084;padding:5px 7px;border-radius:999px}.quick{display:flex;gap:6px;margin-bottom:9px}.quick input,.input,input[type=date],input[type=month],select,textarea{border:1px solid var(--line);background:#fff;border-radius:9px;padding:9px 10px;font-size:11px;outline:none}.quick input{flex:1;min-width:0}.task{border:1px solid #e7eaf0;border-radius:11px;padding:10px;margin:7px 0;background:#fff}.tasktop{display:flex;gap:8px;align-items:flex-start}.tasktitle{flex:1;font-size:12px;font-weight:800;line-height:1.45}.meta{display:flex;gap:5px;flex-wrap:wrap;margin-top:6px}.chip{font-size:9px;background:#f1f3f7;color:#667085;padding:4px 6px;border-radius:6px}.chip.cat{background:#eef0ff;color:#5864c9}.statusrow{display:flex;gap:5px;align-items:center;margin-top:8px}.statusrow select{flex:1;height:31px;padding:0 7px}.iconbtn{border:0;background:transparent;color:#7f8999;font-size:10px;cursor:pointer;padding:5px}.panel{padding:16px;margin-bottom:14px}.panel h3{font-size:14px;margin:0 0 10px}.tabs{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:13px}.tabs .active{background:#111827;color:#fff;border-color:#111827}.plannerhead{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:13px}.periodnav{display:flex;gap:7px;align-items:center}.periodlabel{min-width:190px;text-align:center;font-size:13px;font-weight:850}.addbar{display:grid;grid-template-columns:minmax(260px,1fr) 150px 120px auto;gap:7px;margin-bottom:12px}.tablehead,.workrow{display:grid;grid-template-columns:minmax(280px,1fr) 120px 120px 130px 110px;gap:8px;align-items:center}.tablehead{font-size:9px;color:#8e98aa;padding:0 10px 7px}.workrow{border-top:1px solid #edf0f4;padding:10px}.workrow b{font-size:12px}.workrow p{font-size:9px;color:#8993a5;margin:3px 0 0}.rowactions{display:flex;justify-content:flex-end}.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:9px;color:#758096}.reportgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:14px}.reportbox{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px;min-height:230px}.reportbox h3{font-size:13px;margin:0 0 3px}.reportbox>p{font-size:9px;color:#8994a6;margin:0 0 9px}.reportitem{font-size:10px;line-height:1.5;padding:8px 0;border-top:1px solid #f0f2f5}.reportitem:first-of-type{border-top:0}.reporttext{width:100%;min-height:320px;border:1px solid var(--line);border-radius:10px;padding:12px;line-height:1.6}.history{display:grid;grid-template-columns:95px 1fr 90px;gap:10px;padding:10px 0;border-bottom:1px solid #edf0f4}.history .date{font-size:10px;color:#8a94a5}.history .ttl{font-size:11px;font-weight:750}.history .sub{font-size:9px;color:#8993a5;margin-top:3px}.legacy{justify-self:end;font-size:9px;border:1px solid #d9dee7;border-radius:6px;padding:3px 6px;color:#8993a4}.statusbox{display:flex;gap:11px;background:#f2fbf7;border:1px solid #ccefe1;border-radius:13px;padding:13px;margin-bottom:14px}.statusicon{width:32px;height:32px;border-radius:50%;background:#16a06f;color:#fff;display:grid;place-items:center;font-weight:900}.statusbox h3{font-size:12px;margin:1px 0 3px}.statusbox p{font-size:9px;color:#6e7a8c;margin:0;line-height:1.55}.archive{display:grid;grid-template-columns:110px 60px 1fr;gap:10px;padding:9px 0;border-bottom:1px solid #edf0f4;font-size:10px}.archive .sheet{font-weight:800}.archive .cell{color:#9aa3b3}.filters{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:12px}.search{width:320px}.empty{text-align:center;color:#8b95a6;padding:26px 12px;font-size:11px}.modalbg{position:fixed;inset:0;background:rgba(5,10,20,.46);display:grid;place-items:center;padding:20px;z-index:50}.modal{width:min(590px,100%);background:#fff;border-radius:17px;padding:20px}.modal h2{font-size:18px;margin:0 0 12px}.field{display:block;margin:10px 0}.field span{display:block;font-size:10px;font-weight:750;color:#697386;margin-bottom:5px}.field input,.field select,.field textarea{width:100%}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}.actions{display:flex;justify-content:flex-end;gap:7px;margin-top:14px}.toast{position:fixed;right:20px;bottom:20px;background:#111827;color:#fff;padding:11px 14px;border-radius:10px;font-size:10px;z-index:70}.note{font-size:10px;color:#7c8799;line-height:1.6}.pill{display:inline-block;background:#eef1f6;border-radius:8px;padding:7px 9px;font-size:9px;color:#667085;margin-right:5px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}@media(max-width:1100px){.metrics{grid-template-columns:repeat(3,1fr)}.board,.reportgrid{grid-template-columns:1fr}.tablehead,.workrow{grid-template-columns:minmax(220px,1fr) 110px 110px 115px 100px}}@media(max-width:820px){.side{width:70px}.brand small,.nav span{display:none}.brand{font-size:15px;padding-left:4px}.main{margin-left:70px;width:calc(100% - 70px)}.metrics{grid-template-columns:1fr 1fr}.grid{grid-template-columns:1fr}.addbar{grid-template-columns:1fr 1fr}}@media(max-width:620px){.side{top:auto;bottom:0;width:100%;height:60px;padding:6px}.brand{display:none}.nav{display:flex}.nav button{text-align:center;font-size:9px}.nav span{display:inline}.main{margin-left:0;width:100%;padding-bottom:62px}.wrap{padding:17px}.saved{display:none}.plannerhead{align-items:flex-start;flex-direction:column}.tablehead{display:none}.workrow{grid-template-columns:1fr 1fr}.addbar{grid-template-columns:1fr}.search{width:100%}}

<body>
<div class="app"><aside class="side"><div class="brand">DAYFLOW<small>개인 업무 운영판</small></div><nav class="nav"><button class="active" data-view="dashboard">▦ <span>대시보드</span></button><button data-view="planner">✓ <span>업무계획</span></button><button data-view="history">↺ <span>한 일</span></button><button data-view="report">▥ <span>주간보고</span></button><button data-view="archive">⌕ <span>기존 일계표</span></button><button data-view="settings">⚙ <span>설정</span></button></nav></aside><main class="main"><header><div><p id="eyebrow">DASHBOARD</p><h1 id="pageTitle">대시보드</h1></div><div class="headright"><span id="saveBadge" class="saved">✓ 자동 저장됨</span><button id="globalAdd" class="btn primary">+ 할 일 추가</button></div></header><section id="root" class="wrap"></section></main></div>
<div id="taskModal" class="modalbg hidden"><div class="modal"><h2 id="modalTitle">할 일 추가</h2><form id="taskForm"><input id="editId" type="hidden"><label class="field"><span>업무명</span><input id="taskTitle" class="input" required placeholder="예: 조달 규격서 수정 송부"></label><div class="formgrid"><label class="field"><span>구분</span><input id="taskCategory" class="input" placeholder="파트너 / 조달 / 행사 등"></label><label class="field"><span>계획 단위</span><select id="taskScope"><option value="daily">일간</option><option value="weekly">주간</option><option value="monthly">월간</option></select></label><label class="field"><span>기준일 / 기준월</span><input id="taskTarget" type="date"></label><label class="field"><span>진행상태</span><select id="taskStatus"><option value="todo">○ 예정</option><option value="doing">△ 진행 중</option><option value="done">✓ 완료</option><option value="blocked">! 이슈·대기</option><option value="failed">× 못함</option></select></label></div><label class="field"><span>메모</span><textarea id="taskNote" rows="3"></textarea></label><div class="actions"><button id="cancelModal" type="button" class="btn">취소</button><button class="btn primary">저장</button></div></form></div></div>
<input id="importFile" class="hidden" type="file" accept="application/json,.json"><div id="toast" class="toast hidden"></div>
<script>
const K='dayflow_v4_state',q=s=>document.querySelector(s),qa=s=>[...document.querySelectorAll(s)],E=s=>String(s??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
const D=()=>{let x=new Date();return `${x.getFullYear()}-${String(x.getMonth()+1).padStart(2,'0')}-${String(x.getDate()).padStart(2,'0')}`},dt=s=>new Date(s+'T12:00:00'),fmt=s=>{let x=dt(s);return `${x.getMonth()+1}/${x.getDate()}`},add=(s,n)=>{let x=dt(s);x.setDate(x.getDate()+n);return `${x.getFullYear()}-${String(x.getMonth()+1).padStart(2,'0')}-${String(x.getDate()).padStart(2,'0')}`},mon=s=>{let x=dt(s),d=(x.getDay()+6)%7;x.setDate(x.getDate()-d);return `${x.getFullYear()}-${String(x.getMonth()+1).padStart(2,'0')}-${String(x.getDate()).padStart(2,'0')}`},mkey=s=>s.slice(0,7),uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const ST={todo:['○ 예정','#aab2c1'],doing:['△ 진행 중','#d28d1d'],done:['✓ 완료','#15976a'],blocked:['! 이슈·대기','#d66f2c'],failed:['× 못함','#cf5555']},SC={daily:'일간',weekly:'주간',monthly:'월간'};
const blank=()=>({schemaVersion:4,workItems:[],history:[],legacyArchive:[],plans:[],settings:{}});let S=(()=>{try{return {...blank(),...JSON.parse(localStorage.getItem(K)||'{}')}}catch{return blank()}})(),view='dashboard',plannerTab='weekly',plannerDate=D(),reportWeek=mon(D()),archiveTab='history',archiveSearch='';
function save(msg){localStorage.setItem(K,JSON.stringify(S));let b=q('#saveBadge');if(b){b.textContent='✓ 방금 저장됨';setTimeout(()=>b.textContent='✓ 자동 저장됨',900)}if(msg)toast(msg)}function toast(t){q('#toast').textContent=t;q('#toast').classList.remove('hidden');setTimeout(()=>q('#toast').classList.add('hidden'),1700)}function weekEnd(w){return add(w,6)}function inWeek(t,w){return t.scope==='weekly'?t.target===w:t.scope==='daily'?t.target>=w&&t.target<=weekEnd(w):t.scope==='monthly'?mkey(w)===t.target:false}function doneInWeek(t,w){return ['done','failed'].includes(t.status)&&t.completedAt&&t.completedAt>=w&&t.completedAt<=weekEnd(w)}
function taskCard(t){return `<div class="task"><div class="tasktop"><div class="tasktitle">${E(t.title)}</div><button class="iconbtn" data-act="edit" data-id="${t.id}">수정</button><button class="iconbtn" data-act="delete" data-id="${t.id}">삭제</button></div><div class="meta"><span class="chip cat">${E(t.category||'기타')}</span><span class="chip">${SC[t.scope]||t.scope}</span><span class="chip">${E(t.target||'')}</span></div><div class="statusrow"><span style="font-size:10px;color:${ST[t.status][1]}">${ST[t.status][0]}</span><select data-status-id="${t.id}">${Object.entries(ST).map(([k,v])=>`<option value="${k}" ${t.status===k?'selected':''}>${v[0]}</option>`).join('')}</select></div></div>`}
function dashboard(){let cur=mon(D()),last=add(cur,-7),next=add(cur,7),lastDone=S.workItems.filter(x=>doneInWeek(x,last)),curItems=S.workItems.filter(x=>inWeek(x,cur)&&!['done','failed'].includes(x.status)),nextItems=S.workItems.filter(x=>inWeek(x,next)&&!['done','failed'].includes(x.status)),doing=S.workItems.filter(x=>x.status==='doing').length,blocked=S.workItems.filter(x=>x.status==='blocked').length,done=S.workItems.filter(x=>doneInWeek(x,cur)).length;let col=(title,sub,items,scope,target)=>`<div class="col"><div class="colhead"><div><h3>${title}</h3><p>${sub}</p></div><span class="count">${items.length}</span></div>${scope?`<form class="quick" data-quick-scope="${scope}" data-quick-target="${target}"><input class="input" name="title" placeholder="빠르게 추가"><button class="btn primary">+</button></form>`:''}${items.length?items.map(taskCard).join(''):'<div class="empty">등록된 업무 없음</div>'}</div>`;return `<div class="hero"><small>${D()}</small><h2>이번 주 업무를 한눈에 관리합니다.</h2><p>지난주 결과 → 이번주 실행 → 다음주 계획을 한 화면에서 이어보세요.</p></div><div class="metrics"><div class="metric"><span>이번주 할 일</span><strong>${curItems.length}</strong></div><div class="metric"><span>이번주 완료</span><strong>${done}</strong></div><div class="metric"><span>진행 중</span><strong>${doing}</strong></div><div class="metric"><span>이슈·대기</span><strong>${blocked}</strong></div><div class="metric"><span>다음주 계획</span><strong>${nextItems.length}</strong></div></div><div class="board">${col('지난주 한 일',`${fmt(last)} ~ ${fmt(weekEnd(last))}`,lastDone)}${col('이번주 할 일',`${fmt(cur)} ~ ${fmt(weekEnd(cur))}`,curItems,'weekly',cur)}${col('다음주 할 일',`${fmt(next)} ~ ${fmt(weekEnd(next))}`,nextItems,'weekly',next)}</div>`}
function period(){if(plannerTab==='daily')return plannerDate;if(plannerTab==='weekly')return mon(plannerDate);return mkey(plannerDate)}function label(){let p=period();if(plannerTab==='daily')return p;if(plannerTab==='weekly')return `${fmt(p)} ~ ${fmt(weekEnd(p))}`;return p}function matchPeriod(t){let p=period();return t.scope===plannerTab&&t.target===p}
function planner(){let list=S.workItems.filter(matchPeriod);return `<div class="plannerhead"><div class="tabs"><button class="btn ${plannerTab==='daily'?'active':''}" data-act="ptab" data-tab="daily">일간</button><button class="btn ${plannerTab==='weekly'?'active':''}" data-act="ptab" data-tab="weekly">주간</button><button class="btn ${plannerTab==='monthly'?'active':''}" data-act="ptab" data-tab="monthly">월간</button></div><div class="periodnav"><button class="btn" data-act="prevperiod">←</button><div class="periodlabel">${label()}</div><button class="btn" data-act="nextperiod">→</button><button class="btn" data-act="todayperiod">오늘</button></div></div><div class="panel"><form id="plannerAdd" class="addbar"><input id="plannerTitle" class="input" placeholder="해야 할 일 입력" required><input id="plannerCategory" class="input" placeholder="구분"><select id="plannerStatus"><option value="todo">○ 예정</option><option value="doing">△ 진행 중</option><option value="blocked">! 이슈·대기</option></select><button class="btn primary">추가</button></form><div class="legend"><span>○ 예정</span><span>△ 진행 중</span><span>✓ 완료</span><span>! 이슈·대기</span><span>× 못함</span></div><div class="tablehead"><div>업무</div><div>구분</div><div>계획</div><div>진행상태</div><div></div></div>${list.length?list.map(t=>`<div class="workrow"><div><b>${E(t.title)}</b><p>${E(t.note||'')}</p></div><div><span class="chip cat">${E(t.category||'기타')}</span></div><div><span class="chip">${SC[t.scope]} · ${E(t.target)}</span></div><div><select data-status-id="${t.id}">${Object.entries(ST).map(([k,v])=>`<option value="${k}" ${t.status===k?'selected':''}>${v[0]}</option>`).join('')}</select></div><div class="rowactions"><button class="iconbtn" data-act="edit" data-id="${t.id}">수정</button><button class="iconbtn" data-act="delete" data-id="${t.id}">삭제</button></div></div>`).join(''):'<div class="empty">이 기간에 등록된 업무가 없습니다.</div>'}</div>`}
function history(){let rows=[...S.workItems.filter(x=>['done','failed'].includes(x.status)).map(x=>({date:x.completedAt||x.target,title:x.title,category:x.category,status:x.status,legacy:false})),...(S.history||[]).map(x=>({...x,status:'done',legacy:true}))].sort((a,b)=>String(b.date).localeCompare(String(a.date))).slice(0,500);return `<div class="panel"><h3>한 일 기록</h3><p class="note">업무 상태를 완료 또는 못함으로 바꾸면 자동으로 이곳에 남습니다.</p>${rows.length?rows.map(x=>`<div class="history"><div class="date">${E(x.date||'-')}</div><div><div class="ttl">${E(x.title)}</div><div class="sub">${E(x.category||'기타')} · ${ST[x.status]?.[0]||'✓ 완료'}</div></div>${x.legacy?'<span class="legacy">기존</span>':''}</div>`).join(''):'<div class="empty">완료 기록 없음</div>'}</div>`}
function reportData(w){let last=add(w,-7),next=add(w,7);return{last,lastDone:S.workItems.filter(x=>doneInWeek(x,last)),cur:w,curItems:S.workItems.filter(x=>inWeek(x,w)&&x.status!=='done'),next,nextItems:S.workItems.filter(x=>inWeek(x,next)&&!['done','failed'].includes(x.status))}}function reportText(d){let a=[`[주간 업무 정리]`,``,`1. 지난주 한 일 (${fmt(d.last)}~${fmt(weekEnd(d.last))})`];a.push(...(d.lastDone.length?d.lastDone.map(x=>`- ✓ ${x.title}`):['- 없음']));a.push('',`2. 이번주 할 일 (${fmt(d.cur)}~${fmt(weekEnd(d.cur))})`,...(d.curItems.length?d.curItems.map(x=>`- ${ST[x.status][0]} ${x.title}`):['- 없음']),'',`3. 다음주 할 일 (${fmt(d.next)}~${fmt(weekEnd(d.next))})`,...(d.nextItems.length?d.nextItems.map(x=>`- ${x.title}`):['- 없음']));return a.join('\n')}function report(){let d=reportData(reportWeek),box=(t,s,a,done)=>`<div class="reportbox"><h3>${t}</h3><p>${s}</p>${a.length?a.map(x=>`<div class="reportitem">${done?'✓':ST[x.status][0]} ${E(x.title)}<div class="note">${E(x.category||'기타')}</div></div>`).join(''):'<div class="empty">없음</div>'}</div>`;return `<div class="plannerhead"><div><h3 style="margin:0">주간 업무 정리</h3><div class="note">대시보드와 업무계획 입력 내용을 자동으로 묶습니다.</div></div><div class="periodnav"><button class="btn" data-act="prevreport">←</button><div class="periodlabel">${fmt(d.cur)} ~ ${fmt(weekEnd(d.cur))}</div><button class="btn" data-act="nextreport">→</button><button class="btn" data-act="reporttoday">이번 주</button></div></div><div class="reportgrid">${box('지난주 한 일',`${fmt(d.last)} ~ ${fmt(weekEnd(d.last))}`,d.lastDone,true)}${box('이번주 할 일',`${fmt(d.cur)} ~ ${fmt(weekEnd(d.cur))}`,d.curItems)}${box('다음주 할 일',`${fmt(d.next)} ~ ${fmt(weekEnd(d.next))}`,d.nextItems)}</div><div class="panel"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px"><h3 style="margin:0">복사용 주간보고</h3><button class="btn primary" data-act="copyreport">내용 복사</button></div><textarea id="reportText" class="reporttext">${E(reportText(d))}</textarea></div>`}
function archive(){let ok=(S.history||[]).length||(S.legacyArchive||[]).length,hs=(S.history||[]).filter(x=>[x.title,x.category,x.role,x.date].join(' ').toLowerCase().includes(archiveSearch.toLowerCase())).sort((a,b)=>String(b.date).localeCompare(String(a.date))).slice(0,300),raw=(S.legacyArchive||[]).filter(x=>String(x.value).toLowerCase().includes(archiveSearch.toLowerCase())).slice(0,300);return `${ok?`<div class="statusbox"><div class="statusicon">✓</div><div><h3>기존 일계표 데이터 보존 중</h3><p>과거 업무 ${(S.history||[]).length.toLocaleString()}건, 원본 검색 데이터 ${(S.legacyArchive||[]).length.toLocaleString()}개가 저장되어 있습니다.</p></div></div>`:`<div class="panel"><h3>기존 일계표 가져오기</h3><p class="note">이전에 받은 DAYFLOW 이관 JSON을 다시 선택하면 과거 데이터를 불러옵니다.</p><button class="btn primary" data-act="import">파일 불러오기</button></div>`}<div class="tabs"><button class="btn ${archiveTab==='history'?'active':''}" data-act="archtab" data-tab="history">과거 업무</button><button class="btn ${archiveTab==='raw'?'active':''}" data-act="archtab" data-tab="raw">원본 검색</button></div><div class="filters"><input id="archiveSearch" class="input search" placeholder="검색" value="${E(archiveSearch)}"><button class="btn" data-act="import">파일 불러오기</button></div><div class="panel">${archiveTab==='history'?(hs.length?hs.map(x=>`<div class="history"><div class="date">${E(x.date||'-')}</div><div><div class="ttl">${E(x.title)}</div><div class="sub">${E([x.category,x.role].filter(Boolean).join(' · '))}</div></div><span class="legacy">기존</span></div>`).join(''):'<div class="empty">검색 결과 없음</div>'):(raw.length?raw.map(x=>`<div class="archive"><div class="sheet">${E(x.sheet)}</div><div class="cell">${E(x.cell)}</div><div>${E(x.value)}</div></div>`).join(''):'<div class="empty">검색 결과 없음</div>')}</div>`}
function settings(){return `<div class="grid"><div class="panel"><h3>자동 저장</h3><p class="note">업무 추가, 수정, 삭제, 상태 변경은 모두 이 브라우저에 즉시 자동 저장됩니다.</p></div><div class="panel"><h3>데이터 백업</h3><p class="note">PC 교체나 브라우저 초기화에 대비해 현재 DAYFLOW 데이터를 파일로 받을 수 있습니다.</p><button class="btn primary" data-act="export">내 데이터 백업 파일 받기</button> <button class="btn" data-act="import">백업/이관 파일 불러오기</button></div></div>`}
function openModal(t={},p={}){q('#modalTitle').textContent=t.id?'할 일 수정':'할 일 추가';q('#editId').value=t.id||'';q('#taskTitle').value=t.title||'';q('#taskCategory').value=t.category||p.category||'';q('#taskScope').value=t.scope||p.scope||'daily';q('#taskStatus').value=t.status||p.status||'todo';q('#taskNote').value=t.note||'';setTarget(t.scope||p.scope||'daily',t.target||p.target||D());q('#taskModal').classList.remove('hidden')}function closeModal(){q('#taskModal').classList.add('hidden')}function setTarget(scope,target){let e=q('#taskTarget');if(scope==='monthly'){e.type='month';e.value=(target||D()).slice(0,7)}else{e.type='date';e.value=scope==='weekly'?mon(target||D()):(target||D())}}function norm(scope,v){return scope==='monthly'?(v||mkey(D())):scope==='weekly'?mon(v||D()):(v||D())}function setStatus(id,s){let t=S.workItems.find(x=>x.id===id);if(!t)return;t.status=s;t.updatedAt=D();t.completedAt=['done','failed'].includes(s)?(t.completedAt||D()):null;save();render()}function addItem(o){S.workItems.push({id:uid(),title:o.title,category:o.category||'기타',scope:o.scope||'daily',target:norm(o.scope||'daily',o.target),status:o.status||'todo',note:o.note||'',createdAt:D(),updatedAt:D(),completedAt:['done','failed'].includes(o.status)?D():null});save();render()}
function bind(){qa('[data-act]').forEach(b=>b.onclick=()=>act(b));qa('[data-status-id]').forEach(s=>s.onchange=e=>setStatus(s.dataset.statusId,e.target.value));qa('form[data-quick-scope]').forEach(f=>f.onsubmit=e=>{e.preventDefault();let v=f.elements.title.value.trim();if(v)addItem({title:v,scope:f.dataset.quickScope,target:f.dataset.quickTarget,status:'todo'})});let pa=q('#plannerAdd');if(pa)pa.onsubmit=e=>{e.preventDefault();let v=q('#plannerTitle').value.trim();if(v){addItem({title:v,category:q('#plannerCategory').value.trim()||'기타',scope:plannerTab,target:period(),status:q('#plannerStatus').value});toast('계획에 추가했습니다.')}};let a=q('#archiveSearch');if(a)a.oninput=e=>{archiveSearch=e.target.value;render()}}
function act(b){let a=b.dataset.act,id=b.dataset.id;if(a==='edit')openModal(S.workItems.find(x=>x.id===id));if(a==='delete'){let t=S.workItems.find(x=>x.id===id);if(t&&confirm(`“${t.title}” 업무를 삭제할까요?`)){S.workItems=S.workItems.filter(x=>x.id!==id);save('삭제했습니다.');render()}}if(a==='ptab'){plannerTab=b.dataset.tab;render()}if(a==='prevperiod'){plannerDate=plannerTab==='daily'?add(plannerDate,-1):plannerTab==='weekly'?add(plannerDate,-7):`${dt(plannerDate).getFullYear()}-${String(dt(plannerDate).getMonth()).padStart(2,'0')}-01`;render()}if(a==='nextperiod'){plannerDate=plannerTab==='daily'?add(plannerDate,1):plannerTab==='weekly'?add(plannerDate,7):`${dt(plannerDate).getFullYear()}-${String(dt(plannerDate).getMonth()+2).padStart(2,'0')}-01`;render()}if(a==='todayperiod'){plannerDate=D();render()}if(a==='prevreport'){reportWeek=add(reportWeek,-7);render()}if(a==='nextreport'){reportWeek=add(reportWeek,7);render()}if(a==='reporttoday'){reportWeek=mon(D());render()}if(a==='copyreport')navigator.clipboard.writeText(q('#reportText').value).then(()=>toast('주간보고를 복사했습니다.'));if(a==='archtab'){archiveTab=b.dataset.tab;render()}if(a==='import')q('#importFile').click();if(a==='export'){let blob=new Blob([JSON.stringify(S,null,2)],{type:'application/json'}),u=URL.createObjectURL(blob),x=document.createElement('a');x.href=u;x.download=`DAYFLOW_내데이터_${D()}.json`;x.click();URL.revokeObjectURL(u);toast('백업 파일을 받았습니다.')}}
function render(){let M={dashboard:['DASHBOARD','대시보드'],planner:['PLAN','업무계획'],history:['WORK LOG','한 일'],report:['WEEKLY REPORT','주간보고'],archive:['LEGACY','기존 일계표'],settings:['SETTINGS','설정']};q('#eyebrow').textContent=M[view][0];q('#pageTitle').textContent=M[view][1];qa('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.view===view));q('#root').innerHTML=({dashboard,planner,history,report,archive,settings})[view]();bind()}
qa('.nav button').forEach(b=>b.onclick=()=>{view=b.dataset.view;render()});q('#globalAdd').onclick=()=>openModal();q('#cancelModal').onclick=closeModal;q('#taskModal').onclick=e=>{if(e.target.id==='taskModal')closeModal()};q('#taskScope').onchange=e=>setTarget(e.target.value,q('#taskTarget').value||D());q('#taskForm').onsubmit=e=>{e.preventDefault();let eid=q('#editId').value,scope=q('#taskScope').value,data={title:q('#taskTitle').value.trim(),category:q('#taskCategory').value.trim()||'기타',scope,target:norm(scope,q('#taskTarget').value),status:q('#taskStatus').value,note:q('#taskNote').value.trim(),updatedAt:D()};if(!data.title)return;if(eid){let t=S.workItems.find(x=>x.id===eid);Object.assign(t,data);t.completedAt=['done','failed'].includes(data.status)?(t.completedAt||D()):null}else S.workItems.push({id:uid(),...data,createdAt:D(),completedAt:['done','failed'].includes(data.status)?D():null});save('저장했습니다.');closeModal();render()};q('#importFile').onchange=e=>{let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{let x=JSON.parse(r.result),n=blank();S={...n,...x};if(!Array.isArray(S.workItems))S.workItems=[];if(!S.workItems.length&&Array.isArray(x.tasks))S.workItems=x.tasks.map(t=>({id:t.id||uid(),title:t.title||'업무',category:t.category||'기타',scope:'daily',target:t.dueDate||t.completedDate||D(),status:t.status||'todo',note:t.note||'',createdAt:t.createdDate||D(),updatedAt:D(),completedAt:t.completedDate||null}));S.schemaVersion=4;save('불러오기와 자동 저장이 완료됐습니다.');render()}catch{toast('DAYFLOW JSON 파일인지 확인해주세요.')}};r.readAsText(f);e.target.value=''};render();
</script>
</body></html>
