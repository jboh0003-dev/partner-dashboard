const K='dayflow_v4_state',UI='workhub_ui_v2',PARTNER='workhub_partner_v2';const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];const esc=s=>String(s??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));const STATUS={todo:['○','예정'],doing:['△','진행'],done:['✓','완료'],blocked:['!','이슈'],failed:['×','못함']};let view='dashboard',plannerTab='weekly',plannerDate=today(),liveTab='market',expanded=false,market=null,sports=null;let ui=JSON.parse(localStorage.getItem(UI)||'{}');let partner=JSON.parse(localStorage.getItem(PARTNER)||'{"contracted":"","consulting":"","applications":""}');let S=loadState();
function today(){let d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}function dt(s){return new Date(s+'T12:00:00')}function add(s,n){let d=dt(s);d.setDate(d.getDate()+n);return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}function mon(s){let d=dt(s),x=(d.getDay()+6)%7;d.setDate(d.getDate()-x);return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}function mkey(s){return s.slice(0,7)}function fmt(s){let d=dt(s);return `${d.getMonth()+1}/${d.getDate()}`}function uid(){return crypto.randomUUID?crypto.randomUUID():Date.now()+''+Math.random()}function normalizeState(x){
  x=x&&typeof x==='object'?x:{};
  const workItems=Array.isArray(x.workItems)?x.workItems:(Array.isArray(x.tasks)?x.tasks.map(t=>({
    id:t.id||uid(),title:t.title||'업무',category:t.category||'기타',

  return {schemaVersion:4,workItems,history:Array.isArray(x.history)?x.history:[],legacyArchive:Array.isArray(x.legacyArchive)?x.legacyArchive:[],plans:Array.isArray(x.plans)?x.plans:[],settings:x.settings||{}};
}
function stateScore(x){return (x.workItems?.length||0)*100000+(x.history?.length||0)*100+(x.legacyArchive?.length||0)}
function loadState(){
  const candidates=[];
  const keys=[K,'dayflow_v3_state','dayflow_v2_state','dayflow_v1_state','dayflow_state','workhub_state','workhub_v1_state'];
  const seen=new Set();
  for(const key of keys){
    try{const raw=localStorage.getItem(key);if(!raw)continue;const s=normalizeState(JSON.parse(raw));candidates.push({key,state:s,score:stateScore(s)});seen.add(key)}catch{}
  }
  try{
    for(let i=0;i<localStorage.length;i++){
      const key=localStorage.key(i); if(!key||seen.has(key)||key.startsWith('workhub_snapshot_'))continue;
      const raw=localStorage.getItem(key); if(!raw||raw.length<20)continue;
      const obj=JSON.parse(raw);
      if(obj&&(Array.isArray(obj.workItems)||Array.isArray(obj.tasks)||Array.isArray(obj.history))){
        const s=normalizeState(obj); candidates.push({key,state:s,score:stateScore(s)});
      }
    }
  }catch{}
  try{
    const snaps=[];
    for(let i=0;i<localStorage.length;i++){
      const key=localStorage.key(i); if(!key?.startsWith('workhub_snapshot_'))continue;
      const raw=localStorage.getItem(key); if(!raw)continue;
      const s=normalizeState(JSON.parse(raw)); snaps.push({key,state:s,score:stateScore(s)});
    }
    candidates.push(...snaps);
  }catch{}
  candidates.sort((a,b)=>b.score-a.score);
  const best=candidates[0];
  const current=candidates.find(c=>c.key===K);
  if(best&&best.score>(current?.score||0)){
    try{localStorage.setItem(K,JSON.stringify(best.state));localStorage.setItem('workhub_recovered_from',best.key)}catch{}
    return best.state;
  }
  if(current?.state && stateScore(current.state)>0) return current.state;
  const fallback = normalizeState({
    workItems:[
      {id:'recover-viola',title:'비올라 조달 자료 준비 (차주 월)',category:'기타',scope:'weekly',target:'2026-09-14',status:'doing',note:'',createdAt:'2026-09-14',updatedAt:'2026-09-16',completedAt:null},
      {id:'recover-ai-ppt',title:'AI 발표 ppt 준비(수)',category:'기타',scope:'weekly',target:'2026-09-14',status:'doing',note:'',createdAt:'2026-09-14',updatedAt:'2026-09-16',completedAt:null},
      {id:'recover-partner-report',title:'파트너 계약, 교육 현황 보고(수)',category:'기타',scope:'weekly',target:'2026-09-14',status:'done',note:'',createdAt:'2026-09-14',updatedAt:'2026-09-16',completedAt:'2026-09-16'},

      {id:'recover-procurement',title:'조달 수의상담(수) 10:00',category:'기타',scope:'weekly',target:'2026-09-14',status:'done',note:'',createdAt:'2026-09-14',updatedAt:'2026-09-16',completedAt:'2026-09-16'},
      {id:'recover-acl',title:'ACL행사',category:'기타',scope:'weekly',target:'2026-09-14',status:'doing',note:'',createdAt:'2026-09-14',updatedAt:'2026-09-16',completedAt:null},
      {id:'recover-training',title:'파트너교육(화,수)',category:'기타',scope:'weekly',target:'2026-09-14',status:'done',note:'',createdAt:'2026-09-14',updatedAt:'2026-09-16',completedAt:'2026-09-16'},
      {id:'recover-contract3',title:'파트너계약(3개사)',category:'기타',scope:'weekly',target:'2026-09-14',status:'done',note:'',createdAt:'2026-09-14',updatedAt:'2026-09-16',completedAt:'2026-09-16'}
    ]
  });
  try{
    localStorage.setItem(K,JSON.stringify(fallback));
    localStorage.setItem('workhub_recovered_from','화면 복구 스냅샷 · 2026-09-16');
  }catch{}
  return fallback;
}
function snapshotState(){
  try{
    if(!S||!(S.workItems?.length||S.history?.length||S.legacyArchive?.length))return;
    const stamp=new Date().toISOString().replace(/[:.]/g,'-');
    localStorage.setItem('workhub_snapshot_'+stamp,JSON.stringify(S));
    const keys=[];
    for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);if(k?.startsWith('workhub_snapshot_'))keys.push(k)}
    keys.sort().reverse().slice(8).forEach(k=>localStorage.removeItem(k));
  }catch{}
}
function save(msg){snapshotState();localStorage.setItem(K,JSON.stringify(S));if(msg)toast(msg)}function savePartner(){localStorage.setItem(PARTNER,JSON.stringify(partner))}function toast(t){let x=document.createElement('div');x.textContent=t;x.style='position:fixed;right:18px;bottom:18px;background:#111827;color:white;padding:11px 14px;border-radius:10px;font-size:11px;z-index:150';document.body.appendChild(x);setTimeout(()=>x.remove(),1500)}function weekEnd(w){return add(w,6)}function inWeek(i,w){return i.scope==='weekly'?i.target===w:i.scope==='daily'?i.target>=w&&i.target<=weekEnd(w):i.scope==='monthly'?mkey(w)===i.target:false}function doneInWeek(i,w){return i.status==='done'&&i.completedAt&&i.completedAt>=w&&i.completedAt<=weekEnd(w)}function stateClass(s){return s==='done'?'done':s==='failed'?'failed':s==='blocked'?'blocked':''}function setStatus(id,status){let t=S.workItems.find(x=>x.id===id);if(!t)return;t.status=status;t.updatedAt=today();t.completedAt=['done','failed'].includes(status)?(t.completedAt||today()):null;save();render()}function addItem(o){S.workItems.push({id:uid(),title:o.title,category:o.category||'기타',scope:o.scope||'weekly',target:o.target||mon(today()),status:o.status||'todo',note:o.note||'',createdAt:today(),updatedAt:today(),completedAt:null});save();render()}function del(id){let t=S.workItems.find(x=>x.id===id);if(t&&confirm(`“${t.title}” 업무를 삭제할까요?`)){S.workItems=S.workItems.filter(x=>x.id!==id);save('삭제했습니다.');render()}}
function task(t,compact=false){return `<div class="task ${stateClass(t.status)}"><div class="tasktop"><button class="check" data-act="toggleDone" data-id="${t.id}">${t.status==='done'?'✓':t.status==='failed'?'×':'✓'}</button><div class="tasktitle">${esc(t.title)}</div><div class="taskactions"><button class="icon" data-act="edit" data-id="${t.id}">수정</button><button class="icon" data-act="delete" data-id="${t.id}">삭제</button></div></div><div class="meta"><span class="chip cat">${esc(t.category||'기타')}</span><span class="chip">${t.scope==='daily'?'일간':t.scope==='weekly'?'주간':'월간'}</span><span class="chip">${esc(t.target||'')}</span></div><div class="statusbar">${Object.entries(STATUS).map(([k,v])=>`<button class="status ${k} ${t.status===k?'active':''}" data-act="status" data-id="${t.id}" data-status="${k}">${v[0]} ${v[1]}</button>`).join('')}</div></div>`}
function lane(title,sub,items,focus,target){return `<section class="lane ${focus?'focus':''}"><div class="lanehead"><div><h3>${title}</h3><p>${sub}</p></div><span class="count">${items.length}</span></div>${target?`<form class="quick" data-target="${target}"><input name="title" placeholder="빠르게 할 일 추가"><button class="btn primary">+</button></form>`:''}<div class="tasks">${items.length?items.map(x=>task(x)).join(''):'<div class="empty">등록된 업무 없음</div>'}</div></section>`}
function dashboard(){let recovered=localStorage.getItem('workhub_recovered_from');let recoveryBanner=recovered?'<div style="margin-bottom:12px;padding:12px 14px;border:1px solid #9dd8bf;background:#edf9f4;color:#166b4e;border-radius:12px;font-size:13px;font-weight:800">✓ 기존 업무 데이터를 자동 복구했습니다. ('+esc(recovered)+')</div>':'';let w=mon(today()),last=add(w,-7),next=add(w,7),weekAll=S.workItems.filter(x=>inWeek(x,w)),active=weekAll.filter(x=>!['done','failed'].includes(x.status)),done=weekAll.filter(x=>x.status==='done'),failed=weekAll.filter(x=>x.status==='failed'),doing=weekAll.filter(x=>x.status==='doing'),blocked=weekAll.filter(x=>x.status==='blocked'),lastDone=S.workItems.filter(x=>doneInWeek(x,last)),nextAll=S.workItems.filter(x=>inWeek(x,next));let rate=weekAll.length?Math.round((done.length/weekAll.length)*100):0;return `${recoveryBanner}<div class="metrics"><div class="metric"><span>이번주 남은 업무</span><strong>${active.length} / ${weekAll.length}</strong><div class="progress"><i style="width:${rate}%"></i></div></div><div class="metric"><span>이번주 완료</span><strong>${done.length}</strong></div><div class="metric"><span>진행 중</span><strong>${doing.length}</strong></div><div class="metric"><span>이슈·대기</span><strong>${blocked.length}</strong></div><div class="metric"><span>다음주 계획</span><strong>${nextAll.length}</strong></div></div><div class="dashboard"><div class="workarea"><div class="board">${lane('지난주 한 일',`${fmt(last)} ~ ${fmt(weekEnd(last))}`,lastDone,false)}${lane('이번주 할 일',`${fmt(w)} ~ ${fmt(weekEnd(w))}`,weekAll,true,w)}${lane('다음주 할 일',`${fmt(next)} ~ ${fmt(weekEnd(next))}`,nextAll,false,next)}</div></div>${liveCenter()}</div>`}
function liveCenter(){return `<aside id="live" class="live ${expanded?'expanded':''}"><div class="livehead"><div><b>LIVE CENTER</b><span id="liveUpdated">시장·스포츠 실시간 보드</span></div><div class="livetools"><button data-act="refreshLive" title="새로고침">↻</button><button data-act="expandLive" title="확대">${expanded?'✕':'⤢'}</button></div></div><div class="livetabs"><button class="${liveTab==='market'?'active':''}" data-act="liveTab" data-tab="market">MARKET</button><button class="${liveTab==='kbo'?'active':''}" data-act="liveTab" data-tab="kbo">⚾ KBO</button><button class="${liveTab==='football'?'active':''}" data-act="liveTab" data-tab="football">⚽ FOOTBALL</button></div><div id="liveBody" class="livebody">${liveContent()}</div></aside>`}
function pct(v){let n=Number(v);return Number.isFinite(n)?`${n>0?'+':''}${n.toFixed(2)}%`:'-'}function num(v,d=0){let n=Number(v);return Number.isFinite(n)?n.toLocaleString('ko-KR',{minimumFractionDigits:d,maximumFractionDigits:d}):'-'}function cls(v){let n=Number(v);return n>0?'up':n<0?'down':'flat'}function liveContent(){if(liveTab==='market'){if(!market?.ok)return `<div class="empty">시세 불러오는 중…</div>`;let h=market.hyundai||market.stocks?.find(x=>x.name==='현대차');return `<div class="indices"><div class="index"><span>KOSPI</span><strong>${num(market.kospi?.price,2)}</strong><em class="${cls(market.kospi?.changePct)}">${pct(market.kospi?.changePct)}</em></div><div class="index"><span>USD / KRW</span><strong>₩${num(market.usdkrw?.price,2)}</strong><em class="${cls(market.usdkrw?.changePct)}">${pct(market.usdkrw?.changePct)}</em></div></div>${h?`<div class="hyundai"><div><small>FEATURED · HYUNDAI</small><b>현대차</b></div><strong>${num(h.price)}</strong><em class="${cls(h.changePct)}">${pct(h.changePct)}</em></div>`:''}<div class="market-title"><b>KOSPI 시총 TOP 10</b><span>60초 갱신</span></div><div class="market-list">${(market.stocks||[]).map((s,i)=>`<div class="stock ${s.name==='현대차'?'focus':''}"><span class="rank">${s.rank||i+1}</span><b>${esc(s.name)}</b><span class="price">${num(s.price)}</span><em class="${cls(s.changePct)}">${pct(s.changePct)}</em></div>`).join('')}</div><div class="note">NAVER Finance 실데이터 · 제공처 정책에 따라 지연될 수 있음</div>`}if(liveTab==='kbo'){let games=sports?.kbo||[];return `<div class="section-title"><b>오늘 KBO</b><span>${games.length}경기</span></div><div class="score-list">${games.length?games.map(kboGame).join(''):'<div class="empty">오늘 등록된 KBO 경기가 없거나 데이터를 불러오는 중입니다.</div>'}</div><div class="note">NAVER Sports 스코어 데이터 · 경기 중 60초 자동 갱신</div>`}let e=sports?.soccer?.epl||[],k=sports?.soccer?.korean||[];return `<div class="section-title"><b>EPL · 최근/예정</b><span>${e.length}경기</span></div><div class="score-list">${e.slice(0,10).map(soccerGame).join('')||'<div class="empty">EPL 경기 없음</div>'}</div><div class="section-title"><b>KOREAN PLAYER WATCH</b><span>해외파 주요팀</span></div><div class="score-list">${k.slice(0,10).map(soccerGame).join('')||'<div class="empty">조회 기간 내 해외파 소속팀 경기 없음</div>'}</div><div class="note">EPL + 손흥민·김민재·이강인·황희찬·황인범 소속팀 기준 · ESPN Scoreboard</div>`}
function kboGame(g){let live=g.status==='live',final=g.status==='final',st=live?(g.statusInfo||'LIVE'):final?'종료':g.status==='scheduled'?g.time:g.status;return `<div class="scoregame ${live?'livegame':''}"><div class="scoretop"><span>${esc(g.stadium||'KBO')}</span><span>${esc(st)}</span></div><div class="teams"><div class="team">${esc(g.away)}</div><div class="score">${g.awayScore??'-'}</div><div class="team">${esc(g.home)}</div><div class="score">${g.homeScore??'-'}</div></div></div>`}function soccerGame(g){let time=new Date(g.date).toLocaleString('ko-KR',{month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'}),st=g.state==='in'?(g.detail||'LIVE'):g.state==='post'?'종료':time;return `<div class="scoregame ${g.state==='in'?'livegame':''}"><div class="scoretop"><span>${esc(g.leagueName)}</span><span>${esc(st)}</span></div><div class="teams"><div class="team">${g.away.logo?`<img src="${g.away.logo}" alt="">`:''}${esc(g.away.name)}</div><div class="score">${g.away.score??'-'}</div><div class="team">${g.home.logo?`<img src="${g.home.logo}" alt="">`:''}${esc(g.home.name)}</div><div class="score">${g.home.score??'-'}</div></div>${g.koreanPlayers?.length?`<span class="watchtag">🇰🇷 ${g.koreanPlayers.join(' · ')}</span>`:''}</div>`}
function planner(){let list=S.workItems.filter(x=>x.scope===plannerTab);return `<div class="panel"><div class="tabs">${[['daily','일간'],['weekly','주간'],['monthly','월간']].map(([k,l])=>`<button class="${plannerTab===k?'active':''}" data-act="plannerTab" data-tab="${k}">${l}</button>`).join('')}</div><form id="plannerAdd" class="planneradd"><input id="pTitle" class="input" required placeholder="해야 할 일 입력"><input id="pCat" class="input" placeholder="구분"><button class="btn primary">추가</button></form><div class="planlist">${list.length?list.map(x=>task(x)).join(''):'<div class="empty">등록된 계획이 없습니다.</div>'}</div></div>`}
function report(){let w=mon(today()),last=add(w,-7),next=add(w,7),lastDone=S.workItems.filter(x=>doneInWeek(x,last)),thisDone=S.workItems.filter(x=>doneInWeek(x,w)),nextItems=S.workItems.filter(x=>inWeek(x,next)&&x.status!=='failed'),text=reportText(w,thisDone,nextItems);return `<div class="panel"><h3 style="margin-top:0">파트너 현황</h3><div class="partnergrid"><div class="field"><label>계약 완료 파트너 수</label><input id="partner1" class="input" value="${esc(partner.contracted)}"></div><div class="field"><label>협의 중인 파트너</label><input id="partner2" class="input" value="${esc(partner.consulting)}"></div><div class="field"><label>신청서 수취</label><input id="partner3" class="input" value="${esc(partner.applications)}"></div></div></div><div class="reportgrid" style="margin-top:12px"><div class="reportcard"><h3>지난주 한 일</h3>${lastDone.map((x,i)=>`<div class="reportline">${i+1}. ${esc(x.title)}</div>`).join('')||'<div class="empty">없음</div>'}</div><div class="reportcard"><h3>이번주 완료</h3>${thisDone.map((x,i)=>`<div class="reportline">${i+1}. ${esc(x.title)}</div>`).join('')||'<div class="empty">없음</div>'}</div><div class="reportcard"><h3>다음주 계획</h3>${nextItems.map((x,i)=>`<div class="reportline">${i+1}. ${esc(x.title)}</div>`).join('')||'<div class="empty">없음</div>'}</div></div><div class="panel reportbox"><div class="reporttools"><div><b>메일용 주간보고</b><div class="subclock">첨부하신 형식처럼 바로 복사</div></div><button class="btn primary" data-act="copyReport">주간보고 복사</button></div><textarea id="reportText" readonly>${esc(text)}</textarea></div>`}
function reportText(w,done,nextItems){return [`안녕하세요, 금주 주간 리포트 보고드립니다.`,``,`1. 파트너 현황`,`계약 완료 파트너 수 ${partner.contracted||'-'}`,`협의 중인 파트너 ${partner.consulting||'-'}`,`신청서 수취 ${partner.applications||'-'}`,``,`2. 업무 현황`,...(done.length?done.map((x,i)=>`${i+1})${x.title}`):['1)완료 업무 없음']),``,`3. 차주 주요 일정 및 계획`,...(nextItems.length?nextItems.map((x,i)=>`${i+1})${x.title}`):['1)등록된 차주 계획 없음']),``,`감사합니다.`].join('\n')}
function render(){let map={dashboard:'대시보드',planner:'업무계획',report:'주간보고'};$('#pageTitle').textContent=map[view];$$('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.view===view));$('#root').innerHTML=view==='dashboard'?dashboard():view==='planner'?planner():report();bind()}
function bind(){$$('[data-act]').forEach(b=>b.onclick=()=>act(b));$$('form.quick').forEach(f=>f.onsubmit=e=>{e.preventDefault();let v=f.elements.title.value.trim();if(v)addItem({title:v,target:f.dataset.target,scope:'weekly'})});let pa=$('#plannerAdd');if(pa)pa.onsubmit=e=>{e.preventDefault();let v=$('#pTitle').value.trim();if(!v)return;let target=plannerTab==='daily'?today():plannerTab==='weekly'?mon(today()):mkey(today());addItem({title:v,category:$('#pCat').value.trim()||'기타',scope:plannerTab,target})};['partner1','partner2','partner3'].forEach((id,i)=>{let el=$('#'+id);if(el)el.oninput=e=>{let keys=['contracted','consulting','applications'];partner[keys[i]]=e.target.value;savePartner();let ta=$('#reportText');if(ta){let w=mon(today()),done=S.workItems.filter(x=>doneInWeek(x,w)),next=S.workItems.filter(x=>inWeek(x,add(w,7))&&x.status!=='failed');ta.value=reportText(w,done,next)}}})}
function act(b){let a=b.dataset.act,id=b.dataset.id;if(a==='status')setStatus(id,b.dataset.status);if(a==='toggleDone'){let t=S.workItems.find(x=>x.id===id);if(t)setStatus(id,t.status==='done'?'todo':'done')}if(a==='delete')del(id);if(a==='edit')openEditor(S.workItems.find(x=>x.id===id));if(a==='plannerTab'){plannerTab=b.dataset.tab;render()}if(a==='liveTab'){liveTab=b.dataset.tab;render()}if(a==='expandLive'){expanded=!expanded;if(expanded&&!$('#liveBackdrop')){let x=document.createElement('div');x.id='liveBackdrop';x.className='backdrop';x.onclick=()=>{expanded=false;x.remove();render()};document.body.appendChild(x)}else if(!expanded)$('#liveBackdrop')?.remove();render()}if(a==='refreshLive')loadLive(true);if(a==='copyReport'){navigator.clipboard.writeText($('#reportText').value).then(()=>toast('주간보고를 복사했습니다.'))}}
function openEditor(t){if(!t)return;$('#modalRoot').innerHTML=`<div class="modalbg" id="modalBg"><div class="modal"><h2>업무 수정</h2><div class="field"><label>업무명</label><input id="eTitle" class="input" value="${esc(t.title)}"></div><div class="field"><label>구분</label><input id="eCat" class="input" value="${esc(t.category||'기타')}"></div><div class="field"><label>메모</label><textarea id="eNote" rows="3">${esc(t.note||'')}</textarea></div><div class="statusbar" style="margin:10px 0 0">${Object.entries(STATUS).map(([k,v])=>`<button class="status ${k} ${t.status===k?'active':''}" data-edit-status="${k}">${v[0]} ${v[1]}</button>`).join('')}</div><div class="modalactions"><button class="btn" id="cancelEdit">취소</button><button class="btn primary" id="saveEdit">저장</button></div></div></div>`;let ns=t.status;$$('[data-edit-status]').forEach(b=>b.onclick=()=>{$$('[data-edit-status]').forEach(x=>x.classList.remove('active'));b.classList.add('active');ns=b.dataset.editStatus});$('#cancelEdit').onclick=()=>$('#modalRoot').innerHTML='';$('#saveEdit').onclick=()=>{t.title=$('#eTitle').value.trim()||t.title;t.category=$('#eCat').value.trim()||'기타';t.note=$('#eNote').value.trim();t.status=ns;t.completedAt=['done','failed'].includes(ns)?(t.completedAt||today()):null;save('저장했습니다.');$('#modalRoot').innerHTML='';render()}}
async function loadLive(manual=false){try{let [m,s]=await Promise.all([fetch('/api/public/work-hub-market',{cache:'no-store'}),fetch('/api/public/work-hub-sports',{cache:'no-store'})]);market=await m.json();sports=await s.json();if(manual)toast('LIVE CENTER 갱신 완료')}catch(e){if(manual)toast('일부 실시간 데이터를 불러오지 못했습니다.')}if(view==='dashboard')render()}
function updateClock(){let d=new Date();$('#clock').textContent=d.toLocaleString('ko-KR',{month:'long',day:'numeric',weekday:'short',hour:'2-digit',minute:'2-digit'})}$$('.nav button').forEach(b=>b.onclick=()=>{view=b.dataset.view;render()});$('#addGlobal').onclick=()=>addItem({title:'새 업무',scope:'weekly',target:mon(today())});$('#theme').onclick=()=>{document.body.classList.toggle('dark');ui.dark=document.body.classList.contains('dark');localStorage.setItem(UI,JSON.stringify(ui));$('#theme').textContent=ui.dark?'☀ 라이트':'☾ 다크'};if(ui.dark){document.body.classList.add('dark');$('#theme').textContent='☀ 라이트'}updateClock();setInterval(updateClock,30000);loadLive();setInterval(()=>loadLive(false),60000);render();
</script></body></html>
